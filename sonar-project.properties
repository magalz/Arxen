sonar.projectKey=magalz_Arxen
sonar.organization=magalz
sonar.projectName=Arxen
sonar.sourceEncoding=UTF-8

# Application, operational scripts, migrations and infrastructure are analyzed.
# Test inclusions also remove these paths from the source classification.
sonar.sources=apps/web/src,services/api/src,scripts,migrations,infra,.github
sonar.tests=apps/web/src,services/api/tests,tests
sonar.test.inclusions=apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx,services/api/tests/**,tests/**

# Import the real reports from this workflow run; never version generated reports.
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage/api/coverage.xml,coverage/integration/coverage.xml
sonar.javascript.lcov.reportPaths=coverage/web/lcov.info
