[project]
name = "arxen-api"
version = "0.0.0"
description = "Infrastructure smoke API for Arxen"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.5",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "anyio==4.15.1",
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
]
migration = [
    "alembic==1.20.0",
    "sqlalchemy==2.0.54",
]

[build-system]
requires = ["uv_build==0.12.10"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.10"

[tool.uv.build-backend]
module-name = "arxen_api"
module-root = "services/api/src"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["services/api/tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov=arxen_api",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage/api/coverage.xml",
    "--cov-report=html:coverage/api/html",
    "--junitxml=test-results/api/junit.xml",
]

[tool.coverage.run]
branch = true
source = ["arxen_api"]
data_file = ".coverage.api"

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
precision = 2

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["services/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["services/api/src"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]
