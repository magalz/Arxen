[pytest]
minversion = 9.1
testpaths = .
addopts =
    --strict-config
    --strict-markers
    --import-mode=importlib
    --cov=arxen_api.persistence
    --cov-config=tests/integration/coverage.ini
    --cov-report=term-missing
    --cov-report=xml:coverage/integration/coverage.xml
    --cov-report=html:coverage/integration/html
    --junitxml=test-results/integration/junit.xml
markers =
    integration: requires a real PostgreSQL database with pgvector available
